<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rogelio — English Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #161920;
  --surface2: #1e2230;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #eef0f6;
  --text2: #8b91a8;
  --text3: #454d66;
  --accent: #4f7ef8;
  --green: #34c97a;
  --amber: #f5a623;
  --red: #f05252;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

.app { display: flex; height: 100vh; }

/* ─── LEFT PANEL ─── */
.left-panel {
  width: 70%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 24px 10px;
  border-right: 1px solid var(--border);
  gap: 6px;
  overflow: hidden;
}

.topic-bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.pill {
  font-size: 11px; padding: 4px 13px; border-radius: 20px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); cursor: pointer; transition: all 0.15s;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.avatar-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

/* ── Circular avatar ── */
#rogelio-svg {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 200px;
  height: 200px;
  transition: transform 0.3s ease;
}
.r-circle {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: #1e3a8a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 88px;
  font-weight: 700;
  color: #fff;
  position: relative;
  z-index: 2;
  user-select: none;
}
.r-ripple {
  position: absolute;
  border-radius: 50%;
  border: 2px solid #93c5fd;
  width: 160px;
  height: 160px;
  opacity: 0;
  z-index: 1;
}
#rogelio-svg.speaking .r-ripple:nth-child(1) { animation: ripple 1.6s ease-out 0.0s infinite; }
#rogelio-svg.speaking .r-ripple:nth-child(2) { animation: ripple 1.6s ease-out 0.5s infinite; }
#rogelio-svg.speaking .r-ripple:nth-child(3) { animation: ripple 1.6s ease-out 1.0s infinite; }
@keyframes ripple {
  0%   { transform: scale(1);   opacity: 0.7; }
  100% { transform: scale(2.1); opacity: 0;   }
}
#rogelio-svg.listening .r-circle { animation: orangePulse 1.1s ease-in-out infinite; }
@keyframes orangePulse {
  0%, 100% { box-shadow: 0 0 0 0   rgba(245,166,35,0.55); }
  50%      { box-shadow: 0 0 0 22px rgba(245,166,35,0);   }
}

/* Expression animations */
@keyframes headShake {
  0%,100% { transform: translateX(0) rotate(0); }
  15%     { transform: translateX(-12px) rotate(-5deg); }
  35%     { transform: translateX(12px) rotate(5deg); }
  55%     { transform: translateX(-8px) rotate(-3deg); }
  75%     { transform: translateX(8px) rotate(3deg); }
}
@keyframes shoulderBounce {
  0%,100% { transform: translateY(0) rotate(0deg); }
  25%     { transform: translateY(-10px) rotate(-3deg); }
  50%     { transform: translateY(3px) rotate(1deg); }
  75%     { transform: translateY(-6px) rotate(-2deg); }
}
.avatar-shake  { animation: headShake 0.65s ease forwards; }
.avatar-bounce { animation: shoulderBounce 0.55s ease 3 forwards; }

.mood-text {
  font-size: 13px;
  color: var(--text2);
  text-align: center;
  min-height: 18px;
  transition: all 0.3s;
}
/* Big mic button */
.mic-big {
  width: 68px; height: 68px; border-radius: 50%;
  background: var(--surface2);
  border: 2px solid var(--border2);
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  position: relative;
}
.mic-big:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.05); }
.mic-big.mic-disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
.mic-big.mic-on {
  background: var(--red); border-color: var(--red); color: #fff;
  animation: micPulse 1s infinite;
}
@keyframes micPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(240,82,82,0.45); }
  50%     { box-shadow: 0 0 0 16px rgba(240,82,82,0); }
}
.status-dot {
  position: absolute; top: 4px; right: 4px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--green); border: 2px solid var(--surface2);
  transition: background 0.3s;
}
.status-dot.listening { background: var(--amber); animation: blink 0.5s infinite alternate; }
.status-dot.speaking  { background: var(--accent); animation: blink 0.8s infinite alternate; }
@keyframes blink { to { opacity: 0.3; } }

/* Input area */
.input-area { width: 100%; display: flex; flex-direction: column; gap: 5px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.chip {
  font-size: 10px; padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text3); cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; resize: none; background: var(--surface2);
  border: 1px solid var(--border2); border-radius: 10px;
  color: var(--text); font-family: 'Inter', sans-serif;
  font-size: 13px; padding: 8px 12px;
  min-height: 38px; max-height: 80px; line-height: 1.5; outline: none;
  transition: border 0.2s;
}
textarea::placeholder { color: var(--text3); }
textarea:focus { border-color: var(--accent); }
.btn-send {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
}
.btn-send:hover { background: #3560d4; }
.hint { font-size: 11px; color: var(--text3); text-align: center; min-height: 14px; }

/* ─── RIGHT PANEL ─── */
.right-panel {
  width: 30%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface);
}

.chat-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.chat-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
.score-mini { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.score-mini span { font-size: 11px; color: var(--text2); font-weight: 500; }
.score-track { width: 56px; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.score-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.7s ease; }

/* Messages */
#chat {
  flex: 1; overflow-y: auto;
  padding: 14px 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.msg-system { font-size: 10px; color: var(--text3); text-align: center; padding: 2px 0; }
.msg-label {
  font-size: 9px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 3px;
}
.msg-user .msg-label { text-align: right; }
.msg-text { font-size: 12px; line-height: 1.55; color: var(--text); }
.msg-user .msg-text { color: var(--text2); }

.typing span {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--text3); animation: dot 1.2s infinite; margin: 0 1px;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot { 0%,80%,100%{transform:scale(0.7);opacity:0.4} 40%{transform:scale(1);opacity:1} }

/* Inline feedback */
.msg-fb { margin-top: 5px; display: flex; flex-direction: column; gap: 2px; }
.fbi { font-size: 10px; line-height: 1.45; display: block; }
.fbi-good  { color: var(--green); }
.fbi-fix   { color: var(--amber); }
.fbi-fix del    { color: var(--text3); text-decoration: line-through; }
.fbi-fix strong { color: var(--text); font-weight: 500; }
.fbi-vocab { color: var(--accent); }

.voice-row { display: flex; align-items: center; justify-content: center; gap: 5px; }
.voice-label { font-size: 10px; color: var(--text3); }
#voice-select {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text2); font-size: 10px; border-radius: 6px;
  padding: 3px 6px; outline: none; max-width: 175px;
  font-family: 'Inter', sans-serif; cursor: pointer;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

@media (max-width: 680px) {
  .app { flex-direction: column; }
  .left-panel  { width: 100%; height: 62vh; border-right: none; border-bottom: 1px solid var(--border); }
  .right-panel { width: 100%; height: 38vh; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ══════════ LEFT PANEL ══════════ -->
  <div class="left-panel">
    <div class="topic-bar">
      <button class="pill active" onclick="setTopic('casual',this)">Casual</button>
      <button class="pill" onclick="setTopic('work',this)">Work</button>
      <button class="pill" onclick="setTopic('story',this)">Story</button>
      <button class="pill" onclick="setTopic('finance',this)">Finance</button>
    </div>

    <div class="avatar-stage">
      <div id="rogelio-svg">
        <div class="r-ripple"></div>
        <div class="r-ripple"></div>
        <div class="r-ripple"></div>
        <div class="r-circle">R</div>
      </div>
    </div>

    <div id="rogelio-mood" class="mood-text">Your English conversation partner · Ready to chat</div>

    <button class="mic-big" id="mic-btn" onclick="toggleMic()">
      <div class="status-dot" id="status-dot"></div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M5 10a7 7 0 0014 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8"  y1="22" x2="16" y2="22"/>
      </svg>
    </button>

    <div class="input-area">
      <div class="chips">
        <button class="chip" onclick="chip('I don\'t know how to say ')">Don't know a word</button>
        <button class="chip" onclick="chip('Can you say that again? ')">Repeat please</button>
        <button class="chip" onclick="chip('Today I ')">Today I...</button>
        <button class="chip" onclick="chip('I think that ')">I think that...</button>
      </div>
      <div class="input-row">
        <textarea id="msg" placeholder="Write in English... or use the mic" rows="1"
          onkeydown="handleKey(event)" oninput="grow(this)"></textarea>
        <button class="btn-send" onclick="send()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="voice-row">
        <span class="voice-label">🔊</span>
        <select id="voice-select" onchange="setVoice(this.value)"></select>
      </div>
    </div>
  </div>

  <!-- ══════════ RIGHT PANEL ══════════ -->
  <div class="right-panel">
    <div class="chat-header">
      <span class="chat-title">Conversation</span>
      <div class="score-mini">
        <span id="score-num">—</span>
        <div class="score-track"><div class="score-fill" id="score-fill"></div></div>
      </div>
    </div>
    <div id="chat">
      <div class="msg-rogelio">
        <div class="msg-label">Rogelio</div>
        <div class="msg-text">Hey! Good to see you. So — what's going on? Tell me something interesting.</div>
        <div class="msg-fb"></div>
      </div>
    </div>
  </div>

</div>

<script>
const TOPICS = {
  casual:  "Talk about everyday life: daily routine, food, weekend, family, friends, hobbies. Keep it light and natural.",
  work:    "Talk about work, career, tasks, goals, colleagues. Use office-casual language.",
  story:   "Create a fun roleplay scenario (job interview in Chicago, ordering at a NY deli, meeting a new client). Keep it low-pressure and funny.",
  finance: "Talk about economics, markets, investing, commodities, career in finance. Use conversational language, introduce useful vocabulary naturally."
};

let history = [], topic = "casual", scores = [], listening = false, mouthTimer = null,
    recognition = null, selectedVoice = null, finalTranscript = '',
    userLevel = 1, correctCount = 0, wordsLearned = [], sessionCount = 0;

function systemPrompt() {
  const LEVEL_GUIDE = [
    '',
    'NIVEL 1: Usá frases de 2-3 palabras. Temas: saludos (hello, hi, bye, yes, no), colores básicos, números 1-5.',
    'NIVEL 2: Frases de 3-4 palabras. Temas: presentarse (My name is...), números 1-20, colores, familia (mom, dad).',
    'NIVEL 3: Frases de 4-5 palabras. Temas: "I like...", "I have...", comida básica, animales.',
    'NIVEL 4: Oraciones simples. Temas: rutina diaria (I wake up, I eat breakfast), días de la semana.',
    'NIVEL 5: Oraciones completas. Temas: hobbies, trabajo básico, "I want to...", "I need to..."',
    'NIVEL 6: Oraciones con conectores (because, but, and). Temas: describir personas, opiniones simples.',
    'NIVEL 7: Pasado simple, modales (can, should, would). Temas: experiencias, planes futuros.',
    'NIVEL 8: Phrasal verbs comunes, condicionales simples. Temas: variados.',
    'NIVEL 9: Vocabulario amplio, expresiones naturales. Conversación fluida.',
    'NIVEL 10: Intermedio. Cualquier tema con gramática variada y espontaneidad.'
  ];
  const recent = wordsLearned.slice(-8).join(', ');
  return `Sos Rogelio, un profesor de inglés paciente, directo y gracioso para hispanohablantes principiantes.

NIVEL ACTUAL DEL ALUMNO: ${userLevel}/10
${LEVEL_GUIDE[userLevel]}

REGLAS ABSOLUTAS:
1. SIEMPRE respondés en inglés. Nunca usás español en tu respuesta al alumno, sin excepción.
2. Tu respuesta en inglés es máximo 1-2 oraciones MUY cortas y simples, adaptadas al nivel.
3. Si el alumno escribe en español, igual respondés en inglés. No le contestás en español jamás.
4. Siempre terminás con una pregunta simple en inglés para seguir la conversación.
5. Sos directo y gracioso, no formal ni aburrido.
6. Adaptás la complejidad EXACTAMENTE al nivel indicado.
7. El español SOLO aparece dentro del bloque <<<FB...FB>>> de feedback. En ningún otro lado.
${recent ? `\nPALABRAS YA APRENDIDAS (no las repitas como vocabulario nuevo): ${recent}` : ''}

Contexto del tema: ${TOPICS[topic]}

Después de cada respuesta incluí este bloque EXACTAMENTE:

<<<FB
GOOD:[una cosa que hicieron bien, en español]
FIX:[corrección: MAL → BIEN: razón breve en español. Escribe "Perfect!" si no hay nada que corregir.]
VOCAB:[una palabra útil nueva: PALABRA — definición y ejemplo corto, en español]
SCORE:[entero del 1 al 10]
MOOD:[una palabra: proud / confused / impressed / disappointed / amused / shocked]
FB>>>`;
}

function parse(text) {
  const m = text.match(/<<<FB([\s\S]*?)FB>>>/);
  if (!m) return { reply: text, fb: null };
  const raw = m[1];
  const reply = text.replace(/<<<FB[\s\S]*?FB>>>/, '').trim();
  const get = k => { const r = raw.match(new RegExp(`${k}:(.+)`)); return r ? r[1].trim() : null; };
  return { reply, fb: { good: get('GOOD'), fix: get('FIX'), vocab: get('VOCAB'), score: parseInt(get('SCORE'))||null, mood: get('MOOD') } };
}

/* ── Progress / localStorage ── */
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem('rogelio_progress') || '{}');
    userLevel    = Math.min(Math.max(p.level || 1, 1), 10);
    correctCount = p.correctCount || 0;
    wordsLearned = p.wordsLearned || [];
    sessionCount = (p.sessionCount || 0) + 1;
  } catch(e) {}
  saveProgress();
}

function saveProgress() {
  try {
    localStorage.setItem('rogelio_progress', JSON.stringify(
      { level: userLevel, correctCount, wordsLearned, sessionCount }
    ));
  } catch(e) {}
}

function getInitialGreeting() {
  if (sessionCount > 1) {
    if (userLevel <= 2) return `Hello again! Good to see you! Level ${userLevel}. Say: "Hello, Rogelio!"`;
    if (userLevel <= 4) return `Hey, welcome back! Level ${userLevel}. Ready to practice?`;
    if (userLevel <= 7) return `Hey! Good to see you. Level ${userLevel} — let's keep going! What's up?`;
    return `Welcome back! Level ${userLevel} — you're getting really good! What do you want to talk about?`;
  }
  return `Hello! I am Rogelio. Nice to meet you! Can you say: "Hello, Rogelio!"?`;
}

/* ── Expressions ── */
function setMood(mood) {
  const el = document.getElementById('rogelio-mood');
  const moods = {
    proud:       "Rogelio está orgulloso de vos",
    confused:    "Rogelio está un poco confundido...",
    impressed:   "¡Rogelio está impresionado!",
    disappointed:"Rogelio esperaba más...",
    amused:      "Rogelio se está riendo",
    shocked:     "¡Rogelio está en shock!"
  };
  el.textContent = moods[mood] || "Tu compañero de inglés";
  animateExpression(mood);
}

function triggerAvatarAnim(cls) {
  const el = document.getElementById('rogelio-svg');
  el.classList.remove('avatar-shake', 'avatar-bounce');
  void el.offsetWidth;
  if (cls) el.classList.add(cls);
}

function animateExpression(mood) {
  if (mood === 'disappointed') triggerAvatarAnim('avatar-shake');
  else if (mood === 'amused' || mood === 'impressed' || mood === 'proud' || mood === 'shocked') triggerAvatarAnim('avatar-bounce');
}

function animMouth(on) {
  clearInterval(mouthTimer);
  document.getElementById('rogelio-svg').classList.toggle('speaking', on);
}

function setStatus(s) {
  document.getElementById('status-dot').className = 'status-dot ' + (s || '');
  document.getElementById('rogelio-svg').classList.toggle('listening', s === 'listening');
}

/* ── Voice selection ── */
function pickVoice(voices) {
  if (selectedVoice) return selectedVoice;
  const en = voices.filter(v => v.lang.startsWith('en'));
  const FEMALE = ['hazel','zira','susan','linda','victoria','samantha','karen','fiona','tessa','moira','female'];
  return en.find(v => v.name === 'Google UK English Male')
    || en.find(v => v.name.includes('Microsoft David'))
    || en.find(v => v.name === 'Alex')
    || en.find(v => v.name.toLowerCase().includes('male'))
    || en.find(v => !FEMALE.some(n => v.name.toLowerCase().includes(n)))
    || en[0] || null;
}

function populateVoices() {
  const voices = speechSynthesis.getVoices();
  const sel = document.getElementById('voice-select');
  const prev = sel.value;
  sel.innerHTML = '';
  voices.filter(v => v.lang.startsWith('en')).forEach(v => {
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name.replace('Microsoft ', '').replace(' Online (Natural)', '').replace(' - English (United States)', '').replace(' - English', '');
    sel.appendChild(o);
  });
  const best = prev ? voices.find(v => v.name === prev) : pickVoice(voices);
  if (best) sel.value = best.name;
}

function setVoice(name) {
  selectedVoice = speechSynthesis.getVoices().find(v => v.name === name) || null;
}

/* ── TTS ── */
function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const micBtn = document.getElementById('mic-btn');
  const u = new SpeechSynthesisUtterance(text);
  u.voice = pickVoice(speechSynthesis.getVoices());
  u.rate = 0.92; u.pitch = 1.0;
  u.onstart = () => { setStatus('speaking'); animMouth(true); micBtn.classList.add('mic-disabled'); };
  u.onend   = () => { setStatus(''); animMouth(false); micBtn.classList.remove('mic-disabled'); };
  speechSynthesis.speak(u);
}
loadProgress();
const _firstMsg = document.querySelector('#chat .msg-rogelio .msg-text');
if (_firstMsg) _firstMsg.textContent = getInitialGreeting();

populateVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoices;

/* ── Chat DOM ── */
function addBubble(role, html) {
  const chat = document.getElementById('chat');
  const w = document.createElement('div');
  if (role === 'system') {
    w.innerHTML = `<div class="msg-system">${html}</div>`;
  } else if (role === 'rogelio') {
    w.className = 'msg-rogelio';
    w.innerHTML = `<div class="msg-label">Rogelio</div><div class="msg-text">${html}</div><div class="msg-fb"></div>`;
  } else {
    w.className = 'msg-user';
    w.innerHTML = `<div class="msg-label">Vos</div><div class="msg-text">${html}</div>`;
  }
  chat.appendChild(w);
  chat.scrollTop = chat.scrollHeight;
  return w;
}

/* ── Feedback inline (en español) ── */
function showFeedback(fb) {
  const fbDivs = document.querySelectorAll('.msg-fb');
  const fbDiv  = fbDivs[fbDivs.length - 1];
  if (!fbDiv) return;

  let html = '';
  if (fb.good) html += `<span class="fbi fbi-good">✓ ${fb.good}</span>`;
  if (fb.fix) {
    if (/^perfect/i.test(fb.fix) || /^¡?perfecto/i.test(fb.fix)) {
      html += `<span class="fbi fbi-good">✓ ¡Gramática perfecta!</span>`;
    } else {
      const arrow = fb.fix.indexOf('→');
      if (arrow > -1) {
        const wrong = fb.fix.slice(0, arrow).trim();
        const right = fb.fix.slice(arrow + 1).trim();
        html += `<span class="fbi fbi-fix">↗ <del>${wrong}</del> → <strong>${right}</strong></span>`;
      } else {
        html += `<span class="fbi fbi-fix">↗ ${fb.fix}</span>`;
      }
    }
  }
  if (fb.vocab) html += `<span class="fbi fbi-vocab">💡 ${fb.vocab}</span>`;
  fbDiv.innerHTML = html;

  if (fb.score) {
    scores.push(fb.score);
    const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    document.getElementById('score-fill').style.width = (avg * 10) + '%';
    document.getElementById('score-num').textContent = `${avg}/10`;

    if (fb.score >= 7) {
      correctCount++;
      if (correctCount >= 5 && userLevel < 10) {
        userLevel++;
        correctCount = 0;
        setTimeout(() => addBubble('system', `🎉 ¡Subiste al nivel ${userLevel}/10! Rogelio está orgulloso.`), 400);
      }
      saveProgress();
    }
  }
  if (fb.vocab) {
    const word = fb.vocab.split(/[—\-]/)[0].trim().split(/\s+/)[0].toUpperCase();
    if (word.length > 1 && !wordsLearned.includes(word)) {
      wordsLearned = [...wordsLearned.slice(-49), word];
      saveProgress();
    }
  }
  if (fb.mood) setMood(fb.mood);
}

/* ── Send ── */
async function send() {
  const ta = document.getElementById('msg');
  const text = ta.value.trim();
  if (!text) return;
  if (listening && recognition) { recognition.stop(); }
  ta.value = ''; ta.style.height = ''; finalTranscript = '';
  addBubble('user', text);
  history.push({ role: 'user', content: text });
  const tw = addBubble('rogelio', '<span class="typing"><span></span><span></span><span></span></span>');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, system: systemPrompt() })
    });
    const data = await res.json();
    const { reply, fb } = parse(data.text);
    tw.querySelector('.msg-text').textContent = reply;
    history.push({ role: 'assistant', content: data.text });
    if (fb) showFeedback(fb);
    speak(reply);
  } catch(e) {
    tw.querySelector('.msg-text').textContent = 'Error de conexión. Intentá de nuevo.';
  }
}

/* ── Topics ── */
function setTopic(t, btn) {
  topic = t; history = [];
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  addBubble('system', `Tema: ${t}`);
  const msgs = {
    casual:  "Alright! So what's been going on with you lately?",
    work:    "Nice! So what kind of work do you do?",
    story:   "Okay! Imagine you just walked into a job interview in Chicago. The interviewer says: \"Tell me about yourself.\" — Go!",
    finance: "Interesting! Are you more into investing, or macro economics?"
  };
  setTimeout(() => { addBubble('rogelio', msgs[t]); speak(msgs[t]); }, 150);
}

/* ── Utils ── */
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function grow(el) { el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 80) + 'px'; }
function chip(t) { const ta = document.getElementById('msg'); ta.value = t; ta.focus(); grow(ta); }
function setHint(m) { document.getElementById('hint').textContent = m; }

/* ── Mic ── */
function toggleMic() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    setHint('Usá Chrome o Edge para el micrófono'); return;
  }
  if (listening) { recognition.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = true;
  finalTranscript = '';

  recognition.onstart = () => {
    listening = true;
    document.getElementById('mic-btn').classList.add('mic-on');
    setStatus('listening');
    speechSynthesis.cancel();
    setHint('Escuchando... clic en 🎤 para parar');
  };

  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalTranscript += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    const ta = document.getElementById('msg');
    ta.value = (finalTranscript + interim).trim();
    grow(ta);
  };

  recognition.onerror = e => {
    if (e.error === 'no-speech') return; // silently ignore, keep listening
    listening = false;
    document.getElementById('mic-btn').classList.remove('mic-on');
    setStatus(''); setHint('No te escuché — intentá de nuevo');
  };

  recognition.onend = () => {
    listening = false;
    document.getElementById('mic-btn').classList.remove('mic-on');
    setStatus('');
    const ta = document.getElementById('msg');
    setHint(ta.value.trim() ? 'Enter o ➤ para enviar' : '');
  };

  recognition.start();
}
</script>
