<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rogelio — English Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #161920;
  --surface2: #1e2230;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #eef0f6;
  --text2: #8b91a8;
  --text3: #454d66;
  --accent: #4f7ef8;
  --green: #34c97a;
  --amber: #f5a623;
  --red: #f05252;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

.app { display: flex; height: 100vh; }

/* ─── LEFT PANEL ─── */
.left-panel {
  width: 70%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 24px 10px;
  border-right: 1px solid var(--border);
  gap: 6px;
  overflow: hidden;
}

.topic-bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.pill {
  font-size: 11px; padding: 4px 13px; border-radius: 20px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2); cursor: pointer; transition: all 0.15s;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.avatar-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  width: 100%;
}

#rogelio-svg {
  height: 100%;
  max-height: 310px;
  width: auto;
  filter: drop-shadow(0 10px 40px rgba(79,126,248,0.18));
  transition: transform 0.3s ease;
}

/* Expression animations */
@keyframes headShake {
  0%,100% { transform: translateX(0) rotate(0); }
  15%     { transform: translateX(-12px) rotate(-5deg); }
  35%     { transform: translateX(12px) rotate(5deg); }
  55%     { transform: translateX(-8px) rotate(-3deg); }
  75%     { transform: translateX(8px) rotate(3deg); }
}
@keyframes shoulderBounce {
  0%,100% { transform: translateY(0) rotate(0deg); }
  25%     { transform: translateY(-10px) rotate(-3deg); }
  50%     { transform: translateY(3px) rotate(1deg); }
  75%     { transform: translateY(-6px) rotate(-2deg); }
}
.avatar-shake  { animation: headShake 0.65s ease forwards; }
.avatar-bounce { animation: shoulderBounce 0.55s ease 3 forwards; }

.mood-text {
  font-size: 13px;
  color: var(--text2);
  text-align: center;
  min-height: 18px;
  transition: all 0.3s;
}
.status-text {
  font-size: 11px;
  color: var(--amber);
  min-height: 14px;
  text-align: center;
  letter-spacing: 0.03em;
}

/* Big mic button */
.mic-big {
  width: 68px; height: 68px; border-radius: 50%;
  background: var(--surface2);
  border: 2px solid var(--border2);
  color: var(--text2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  position: relative;
}
.mic-big:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.05); }
.mic-big.mic-on {
  background: var(--red); border-color: var(--red); color: #fff;
  animation: micPulse 1s infinite;
}
@keyframes micPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(240,82,82,0.45); }
  50%     { box-shadow: 0 0 0 16px rgba(240,82,82,0); }
}
.status-dot {
  position: absolute; top: 4px; right: 4px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--green); border: 2px solid var(--surface2);
  transition: background 0.3s;
}
.status-dot.listening { background: var(--amber); animation: blink 0.5s infinite alternate; }
.status-dot.speaking  { background: var(--accent); animation: blink 0.8s infinite alternate; }
@keyframes blink { to { opacity: 0.3; } }

/* Input area */
.input-area { width: 100%; display: flex; flex-direction: column; gap: 5px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.chip {
  font-size: 10px; padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text3); cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1; resize: none; background: var(--surface2);
  border: 1px solid var(--border2); border-radius: 10px;
  color: var(--text); font-family: 'Inter', sans-serif;
  font-size: 13px; padding: 8px 12px;
  min-height: 38px; max-height: 80px; line-height: 1.5; outline: none;
  transition: border 0.2s;
}
textarea::placeholder { color: var(--text3); }
textarea:focus { border-color: var(--accent); }
.btn-send {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent); border: none; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
}
.btn-send:hover { background: #3560d4; }
.hint { font-size: 11px; color: var(--text3); text-align: center; min-height: 14px; }

/* ─── RIGHT PANEL ─── */
.right-panel {
  width: 30%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface);
}

.chat-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.chat-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }
.score-mini { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.score-mini span { font-size: 11px; color: var(--text2); font-weight: 500; }
.score-track { width: 56px; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.score-fill { height: 100%; background: var(--accent); border-radius: 2px; width: 0%; transition: width 0.7s ease; }

/* Messages */
#chat {
  flex: 1; overflow-y: auto;
  padding: 14px 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.msg-system { font-size: 10px; color: var(--text3); text-align: center; padding: 2px 0; }
.msg-label {
  font-size: 9px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 3px;
}
.msg-user .msg-label { text-align: right; }
.msg-text { font-size: 12px; line-height: 1.55; color: var(--text); }
.msg-user .msg-text { color: var(--text2); }

.typing span {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--text3); animation: dot 1.2s infinite; margin: 0 1px;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot { 0%,80%,100%{transform:scale(0.7);opacity:0.4} 40%{transform:scale(1);opacity:1} }

/* Inline feedback */
.msg-fb { margin-top: 5px; display: flex; flex-direction: column; gap: 2px; }
.fbi { font-size: 10px; line-height: 1.45; display: block; }
.fbi-good  { color: var(--green); }
.fbi-fix   { color: var(--amber); }
.fbi-fix del    { color: var(--text3); text-decoration: line-through; }
.fbi-fix strong { color: var(--text); font-weight: 500; }
.fbi-vocab { color: var(--accent); }

.voice-row { display: flex; align-items: center; justify-content: center; gap: 5px; }
.voice-toggle { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 12px; padding: 2px 4px; line-height: 1; }
.voice-toggle:hover { color: var(--text2); }
#voice-select {
  display: none; background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text2); font-size: 10px; border-radius: 6px;
  padding: 3px 6px; outline: none; max-width: 155px;
  font-family: 'Inter', sans-serif;
}
#voice-select.visible { display: block; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

@media (max-width: 680px) {
  .app { flex-direction: column; }
  .left-panel  { width: 100%; height: 62vh; border-right: none; border-bottom: 1px solid var(--border); }
  .right-panel { width: 100%; height: 38vh; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ══════════ LEFT PANEL ══════════ -->
  <div class="left-panel">
    <div class="topic-bar">

            <stop offset="0%" stop-color="#1e2f5a" stop-opacity="0.6"/>

        <!-- shirt body -->
        <rect x="8" y="196" width="184" height="64" rx="18" fill="#1e40a8"/>

        <path d="M100 22 C72 22,34 52,34 92 C34 128,56 162,80 172 C88 176,94 178,100 178 C106 178,112 176,120 172 C144 162,166 128,166 92 C166 52,128 22,100 22 Z" fill="url(#skinGrad)"/>

        <!-- hair highlight (shine on top-left) -->

        <!-- eyebrows — filled organic shapes, thick and natural -->
        <path id="brow-l" d="M57 76 C65 69,78 67,93 71 C92 76,78 73,57 80 Z" fill="#1c0e06"/>
        <path id="brow-r" d="M107 71 C122 67,135 69,143 76 C143 80,122 73,107 76 Z" fill="#1c0e06"/>

        <ellipse cx="72" cy="91" rx="16" ry="13" fill="white"/>
        <ellipse cx="128" cy="91" rx="16" ry="13" fill="white"/>

        <circle cx="72" cy="92" r="10" fill="url(#irisGrad)"/>

        <!-- lower eyelid line (subtle) -->
        <path d="M58 96 Q72 103 86 96" stroke="#8a4a28" stroke-width="0.9" fill="none" opacity="0.45"/>
        <path d="M114 96 Q128 103 142 96" stroke="#8a4a28" stroke-width="0.9" fill="none" opacity="0.45"/>

        <!-- cheek blush -->
        <ellipse cx="46" cy="112" rx="22" ry="13" fill="#e86060" opacity="0.09"/>
        <ellipse cx="154" cy="112" rx="22" ry="13" fill="#e86060" opacity="0.09"/>

        <path d="M98 106 Q95 116 91 122" stroke="#a05e30" stroke-width="1.6" fill="none" stroke-linecap="round"/>

        <ellipse cx="106" cy="123" rx="5.5" ry="3.5" fill="#a86038"/>

    <div id="rogelio-mood" class="mood-text">Your English conversation partner · Ready to chat</div>

        <rect x="9" y="2" width="6" height="11" rx="3"/>

<script>
const TOPICS = {
  casual:  "Talk about everyday life: daily routine, food, weekend, family, friends, hobbies. Keep it light and natural.",
  work:    "Talk about work, career, tasks, goals, colleagues. Use office-casual language.",
  story:   "Create a fun roleplay scenario (job interview in Chicago, ordering at a NY deli, meeting a new client). Keep it low-pressure and funny.",
  finance: "Talk about economics, markets, investing, commodities, career in finance. Use conversational language, introduce useful vocabulary naturally."
};

let history = [], topic = "casual", scores = [], listening = false, mouthTimer = null, recognition = null, selectedVoice = null, finalTranscript = '';

function systemPrompt() {
  return `You are Rogelio, a funny, direct, slightly sarcastic but warm male English-speaking colleague in his 30s. You help a beginner Argentine Spanish speaker practice natural conversational English. They know basics but make grammar mistakes.

Topic: ${TOPICS[topic]}

RULES:
1. Reply in 1-2 sentences MAX. Short and punchy. Use casual connectors: "you know", "I mean", "honestly", "kind of".
2. Show personality — make jokes, tease them gently when they make mistakes, be encouraging but real.
3. After every reply add this block EXACTLY:

<<<FB
GOOD:[una cosa que hicieron bien, escrita en español]
FIX:[corrección principal: MAL → BIEN: razón breve en español. Escribe "Perfect!" si no hay nada que corregir.]
VOCAB:[una palabra/frase útil: PALABRA — definición y ejemplo corto, en español]
SCORE:[entero del 1 al 10]
MOOD:[una palabra: proud / confused / impressed / disappointed / amused / shocked]
FB>>>

4. If they write in Spanish, reply in English, note it gently, show them how to say it in English.
5. If they say "I don't know how to say", help them find the expression.
6. Never break character. You are Rogelio, not an AI.`;
}

function parse(text) {
  const m = text.match(/<<<FB([\s\S]*?)FB>>>/);
  if (!m) return { reply: text, fb: null };
  const raw = m[1];
  const reply = text.replace(/<<<FB[\s\S]*?FB>>>/, '').trim();
  const get = k => { const r = raw.match(new RegExp(`${k}:(.+)`)); return r ? r[1].trim() : null; };
  return { reply, fb: { good: get('GOOD'), fix: get('FIX'), vocab: get('VOCAB'), score: parseInt(get('SCORE'))||null, mood: get('MOOD') } };
}

/* ── Expressions ── */
function setMood(mood) {
  const el = document.getElementById('rogelio-mood');
  const moods = {
    proud:       "Rogelio está orgulloso de vos",
    confused:    "Rogelio está un poco confundido...",
    impressed:   "¡Rogelio está impresionado!",
    disappointed:"Rogelio esperaba más...",
    amused:      "Rogelio se está riendo",
    shocked:     "¡Rogelio está en shock!"
  };
  el.textContent = moods[mood] || "Tu compañero de inglés";
  animateExpression(mood);
}

function triggerAvatarAnim(cls) {
  const svg = document.getElementById('rogelio-svg');
  svg.classList.remove('avatar-shake', 'avatar-bounce');
  void svg.offsetWidth;
  if (cls) svg.classList.add(cls);
}

function setMouthClosed(upPath, loPath) {
  const defUp = 'M76 138 Q87 134 100 136 Q113 134 124 138 Q113 143 100 144 Q87 143 76 138 Z';
  const defLo = 'M76 138 Q100 158 124 138 Q112 162 100 163 Q88 162 76 138 Z';
  document.getElementById('mouth').setAttribute('d', upPath || defUp);
  document.getElementById('mouth-lo').setAttribute('d', loPath || defLo);
  const inner = document.getElementById('mouth-inner');
  inner.setAttribute('rx', '0'); inner.setAttribute('ry', '0');
  const teeth = document.getElementById('teeth');
  teeth.setAttribute('width', '0'); teeth.setAttribute('height', '0');
}

function animateExpression(mood) {
  const browL = document.getElementById('brow-l');
  const browR = document.getElementById('brow-r');
  const eyeL  = document.getElementById('eye-l');
  const eyeR  = document.getElementById('eye-r');

  // reset neutral
  browL.setAttribute('d', 'M57 76 C65 69,78 67,93 71 C92 76,78 73,57 80 Z');
  browR.setAttribute('d', 'M107 71 C122 67,135 69,143 76 C143 80,122 73,107 76 Z');
  eyeL.setAttribute('ry', '6'); eyeR.setAttribute('ry', '6');
  setMouthClosed();

  if (mood === 'impressed' || mood === 'proud' || mood === 'shocked') {
    // brows high, eyes wide, big open smile
    browL.setAttribute('d', 'M57 68 C65 61,78 59,93 63 C92 68,78 65,57 72 Z');
    browR.setAttribute('d', 'M107 63 C122 59,135 61,143 68 C143 72,122 65,107 68 Z');
    eyeL.setAttribute('ry', '9'); eyeR.setAttribute('ry', '9');
    setMouthClosed(
      'M72 133 Q86 128 100 130 Q114 128 128 133 Q116 140 100 141 Q84 140 72 133 Z',

  } else if (mood === 'disappointed') {

}

/* ── Mouth animation — 3 frames ── */
const MOUTH_FRAMES = [
  // 0 closed — full natural lips
  { up: 'M76 138 Q87 134 100 136 Q113 134 124 138 Q113 143 100 144 Q87 143 76 138 Z',
    lo: 'M76 138 Q100 158 124 138 Q112 162 100 163 Q88 162 76 138 Z',
    irx: 0,  iry: 0,  icy: 150, tx: 100, ty: 140, tw: 0,  th: 0  },
  // 1 half-open — teeth start to show
  { up: 'M76 134 Q88 129 100 131 Q112 129 124 134 Q113 139 100 140 Q87 139 76 134 Z',
    lo: 'M77 151 Q100 166 123 151 Q112 169 100 170 Q88 169 77 151 Z',
    irx: 21, iry: 8,  icy: 152, tx: 83,  ty: 135, tw: 34, th: 11 },
  // 2 fully open — wide open, teeth clearly visible
  { up: 'M75 130 Q88 125 100 127 Q112 125 125 130 Q113 135 100 136 Q87 135 75 130 Z',
    lo: 'M77 158 Q100 174 123 158 Q113 174 100 175 Q87 174 77 158 Z',
    irx: 27, iry: 14, icy: 158, tx: 81,  ty: 131, tw: 38, th: 13 }
];

function applyMouthFrame(f) {
  document.getElementById('mouth').setAttribute('d', f.up);
  document.getElementById('mouth-lo').setAttribute('d', f.lo);
  const inner = document.getElementById('mouth-inner');
  inner.setAttribute('cy', f.icy); inner.setAttribute('rx', f.irx); inner.setAttribute('ry', f.iry);
  const teeth = document.getElementById('teeth');
  teeth.setAttribute('x', f.tx); teeth.setAttribute('y', f.ty);
  teeth.setAttribute('width', f.tw); teeth.setAttribute('height', f.th);
}

function animMouth(on) {
  clearInterval(mouthTimer);
  if (!on) { applyMouthFrame(MOUTH_FRAMES[0]); return; }
  const seq = [0, 1, 2, 2, 1, 0, 2, 1, 2, 0, 1, 2];
  let idx = 0;
  mouthTimer = setInterval(() => {
    applyMouthFrame(MOUTH_FRAMES[seq[idx % seq.length]]);
    idx++;
  }, 115);
}

function setStatus(s) {
  document.getElementById('status-dot').className = 'status-dot ' + (s || '');
  const txt = document.getElementById('status-text');
  if      (s === 'listening') txt.textContent = 'Escuchando...';
  else if (s === 'speaking')  txt.textContent = 'Hablando...';
  else                        txt.textContent = '';
}

/* ── Voice selection ── */
function pickVoice(voices) {
  if (selectedVoice) return selectedVoice;
  const en = voices.filter(v => v.lang.startsWith('en'));
  const YOUNG = ['guy', 'ryan', 'andrew', 'eric', 'jason', 'daniel', 'christopher', 'liam', 'noah', 'marcus', 'alex', 'tom'];
  const SKIP  = ['hazel', 'zira', 'susan', 'linda', 'victoria', 'samantha', 'karen', 'fiona', 'tessa', 'moira', 'female'];
  return en.find(v => v.lang === 'en-US' && YOUNG.some(n => v.name.toLowerCase().includes(n)))
    || en.find(v => v.lang === 'en-US' && !SKIP.some(n => v.name.toLowerCase().includes(n)))
    || en.find(v => YOUNG.some(n => v.name.toLowerCase().includes(n)))
    || en.find(v => v.lang === 'en-US')
    || en[0] || null;
}

function populateVoices() {
  const voices = speechSynthesis.getVoices();
  const sel = document.getElementById('voice-select');
  const prev = sel.value;
  sel.innerHTML = '';
  voices.filter(v => v.lang.startsWith('en')).forEach(v => {
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name.replace('Microsoft ', '').replace(' Online (Natural)', '').replace(' - English (United States)', '').replace(' - English', '');
    sel.appendChild(o);
  });
  const best = prev ? voices.find(v => v.name === prev) : pickVoice(voices);
  if (best) sel.value = best.name;
}

function setVoice(name) {
  selectedVoice = speechSynthesis.getVoices().find(v => v.name === name) || null;
}

function toggleVoicePicker() {
  const sel = document.getElementById('voice-select');
  sel.classList.toggle('visible');
  if (sel.classList.contains('visible')) populateVoices();
}

/* ── TTS ── */
function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = pickVoice(speechSynthesis.getVoices());
  u.rate = 0.92; u.pitch = 1.0;
  u.onstart = () => { setStatus('speaking'); animMouth(true); };
  u.onend   = () => { setStatus(''); animMouth(false); };
  speechSynthesis.speak(u);
}
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoices;

/* ── Chat DOM ── */
function addBubble(role, html) {
  const chat = document.getElementById('chat');
  const w = document.createElement('div');
  if (role === 'system') {
    w.innerHTML = `<div class="msg-system">${html}</div>`;
  } else if (role === 'rogelio') {
    w.className = 'msg-rogelio';
    w.innerHTML = `<div class="msg-label">Rogelio</div><div class="msg-text">${html}</div><div class="msg-fb"></div>`;
  } else {
    w.className = 'msg-user';
    w.innerHTML = `<div class="msg-label">Vos</div><div class="msg-text">${html}</div>`;
  }
  chat.appendChild(w);
  chat.scrollTop = chat.scrollHeight;
  return w;
}

/* ── Feedback inline (en español) ── */
function showFeedback(fb) {
  const fbDivs = document.querySelectorAll('.msg-fb');
  const fbDiv  = fbDivs[fbDivs.length - 1];
  if (!fbDiv) return;

  let html = '';
  if (fb.good) html += `<span class="fbi fbi-good">✓ ${fb.good}</span>`;
  if (fb.fix) {
    if (/^perfect/i.test(fb.fix) || /^¡?perfecto/i.test(fb.fix)) {
      html += `<span class="fbi fbi-good">✓ ¡Gramática perfecta!</span>`;
    } else {
      const arrow = fb.fix.indexOf('→');
      if (arrow > -1) {
        const wrong = fb.fix.slice(0, arrow).trim();
        const right = fb.fix.slice(arrow + 1).trim();
        html += `<span class="fbi fbi-fix">↗ <del>${wrong}</del> → <strong>${right}</strong></span>`;
      } else {
        html += `<span class="fbi fbi-fix">↗ ${fb.fix}</span>`;
      }
    }
  }
  if (fb.vocab) html += `<span class="fbi fbi-vocab">💡 ${fb.vocab}</span>`;
  fbDiv.innerHTML = html;

  if (fb.score) {
    scores.push(fb.score);
    const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
    document.getElementById('score-fill').style.width = (avg * 10) + '%';
    document.getElementById('score-num').textContent = `${avg}/10`;
  }
  if (fb.mood) setMood(fb.mood);
}

/* ── Send ── */
async function send() {
  const ta = document.getElementById('msg');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = ''; ta.style.height = '';
  addBubble('user', text);
  history.push({ role: 'user', content: text });
  const tw = addBubble('rogelio', '<span class="typing"><span></span><span></span><span></span></span>');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, system: systemPrompt() })
    });
    const data = await res.json();
    const { reply, fb } = parse(data.text);
    tw.querySelector('.msg-text').textContent = reply;
    history.push({ role: 'assistant', content: data.text });
    if (fb) showFeedback(fb);
    speak(reply);
  } catch(e) {
    tw.querySelector('.msg-text').textContent = 'Error de conexión. Intentá de nuevo.';
  }
}

/* ── Topics ── */
function setTopic(t, btn) {
  topic = t; history = [];
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  addBubble('system', `Tema: ${t}`);
  const msgs = {
    casual:  "Alright! So what's been going on with you lately?",
    work:    "Nice! So what kind of work do you do?",
    story:   "Okay! Imagine you just walked into a job interview in Chicago. The interviewer says: \"Tell me about yourself.\" — Go!",
    finance: "Interesting! Are you more into investing, or macro economics?"
  };
  setTimeout(() => { addBubble('rogelio', msgs[t]); speak(msgs[t]); }, 150);
}

/* ── Utils ── */
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function grow(el) { el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 80) + 'px'; }
function chip(t) { const ta = document.getElementById('msg'); ta.value = t; ta.focus(); grow(ta); }
function setHint(m) { document.getElementById('hint').textContent = m; }

/* ── Mic ── */
function toggleMic() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    setHint('Usá Chrome o Edge para el micrófono'); return;
  }
  if (listening) { recognition.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = true;
  finalTranscript = '';

  recognition.onstart = () => {
    listening = true;
    document.getElementById('mic-btn').classList.add('mic-on');
    setStatus('listening');
    speechSynthesis.cancel();
    setHint('Escuchando... clic en 🎤 para parar');
  };

  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalTranscript += e.results[i][0].transcript + ' ';
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    const ta = document.getElementById('msg');
    ta.value = (finalTranscript + interim).trim();
    grow(ta);
  };

  recognition.onerror = e => {
    if (e.error === 'no-speech') return; // silently ignore, keep listening
    listening = false;
    document.getElementById('mic-btn').classList.remove('mic-on');
    setStatus(''); setHint('No te escuché — intentá de nuevo');
  };

  recognition.onend = () => {
    listening = false;
    document.getElementById('mic-btn').classList.remove('mic-on');
    setStatus('');
    const ta = document.getElementById('msg');
    setHint(ta.value.trim() ? 'Enter o ➤ para enviar' : '');
  };

  recognition.start();
}
